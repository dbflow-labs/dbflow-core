name: tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  release-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release archive contents
        run: |
          set -euo pipefail

          ARCHIVE="/tmp/dbflow-core-release.tar"
          FILELIST="/tmp/dbflow-core-release-files.txt"

          git archive --format=tar HEAD > "$ARCHIVE"
          tar -tf "$ARCHIVE" > "$FILELIST"

          FAILED=0

          check_forbidden() {
            local pattern="$1"
            local label="$2"
            if grep -qE "$pattern" "$FILELIST"; then
              echo "ERROR: forbidden path present in release archive: $label"
              grep -E "$pattern" "$FILELIST" | head -20
              FAILED=1
            fi
          }

          check_required() {
            local pattern="$1"
            local label="$2"
            if ! grep -qE "$pattern" "$FILELIST"; then
              echo "ERROR: required path missing from release archive: $label"
              FAILED=1
            fi
          }

          check_forbidden '^composer\.lock$' 'composer.lock'
          check_forbidden '^\.github/' '.github/'
          check_forbidden '^tests/' 'tests/'
          check_forbidden '^docs/' 'docs/'
          check_forbidden '^build/' 'build/'
          check_forbidden '^phpunit\.xml$' 'phpunit.xml'
          check_forbidden '^\.php-cs-fixer\.dist\.php$' '.php-cs-fixer.dist.php'
          check_forbidden '^phpstan\.neon$' 'phpstan.neon'
          check_forbidden '^phpstan\.neon\.dist$' 'phpstan.neon.dist'
          check_forbidden '^\.gitattributes$' '.gitattributes'
          check_forbidden '^\.gitignore$' '.gitignore'
          check_forbidden '^RELEASE-NOTES-' 'RELEASE-NOTES-*.md'
          check_forbidden '^UPGRADE-' 'UPGRADE-*.md'

          check_required '^composer\.json$' 'composer.json'
          check_required '^README\.md$' 'README.md'
          check_required '^LICENSE$' 'LICENSE'
          check_required '^CHANGELOG\.md$' 'CHANGELOG.md'
          check_required '^SECURITY\.md$' 'SECURITY.md'
          check_required '^src/' 'src/'
          check_required '^config/' 'config/'
          check_required '^database/migrations/' 'database/migrations/'

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Release archive validation failed."
            echo "Archive file count: $(wc -l < "$FILELIST")"
            exit 1
          fi

          echo "Release archive validation passed."
          echo "Archive file count: $(wc -l < "$FILELIST")"

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SCAN_PATHS: src/ config/ tests/ README.md

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite, mbstring, xml, dom, json
          coverage: pcov
          tools: composer

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Architecture compliance - DBErp leakage
        run: |
          if rg "Dberp|PurchaseRequest|DberpPermissionService|PurchaseRequestStatus" ${{ env.SCAN_PATHS }}; then
            echo "Forbidden DBErp terms found in package release paths."
            exit 1
          fi

      - name: Architecture compliance - stale App\\DBFlow namespace
        run: |
          if rg "namespace App\\\\DBFlow|use App\\\\DBFlow|App\\\\\\\\DBFlow" ${{ env.SCAN_PATHS }}; then
            echo "Stale App\\\\DBFlow namespace found in package release paths."
            exit 1
          fi

      - name: Architecture compliance - forbidden brand terms
        run: |
          if rg -i "loongdom|DBFlow\\\\Core|dbflow/core" ${{ env.SCAN_PATHS }} composer.json; then
            echo "Forbidden brand terms found in package release paths."
            exit 1
          fi

      - name: Architecture compliance - English-only source
        run: |
          if rg -n "[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]" ${{ env.SCAN_PATHS }}; then
            echo "Non-English characters found in package release paths."
            exit 1
          fi

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p build
          composer test:coverage

      - name: Enforce coverage thresholds
        if: matrix.php == '8.3'
        run: composer coverage:check

      - name: Run PHPStan
        run: composer phpstan
